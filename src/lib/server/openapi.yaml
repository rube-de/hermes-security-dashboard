openapi: 3.1.0
info:
  title: Hermes Security Dashboard API
  version: 1.0.0
  description: |
    HTTP API the Hermes agent uses to feed the security dashboard, plus the read
    endpoints the UI consumes. The agent registers repositories, streams live
    scan progress, and submits finished review reports; the dashboard stores and
    renders them.

    **Auth.** Reads are open. Writes (the agent-facing mutations) honour
    `HERMES_API_TOKEN`: if it is set, they require `Authorization: Bearer <token>`
    and return `401 {"error":"unauthorized"}` otherwise; if it is unset, writes
    are unauthenticated (and the server logs a loud startup warning).

    **Base path.** When the image is built with `BASE_PATH` (e.g. `/security`),
    every path below — UI *and* `/api/*` — is served only under that prefix, and
    the root 404s. Pick the matching `servers` entry.

    **Raw values.** Read responses carry data, not display text: timestamps are
    epoch-ms (UTC) and durations are whole seconds. Formatting is the client's job
    (the dashboard renders them in the browser's local time zone).

    This document is hand-maintained from the route handlers; it is not generated.
    The test suite checks the read endpoints' responses against these schemas, so
    the two cannot drift apart unnoticed.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Root-path deployment (BASE_PATH unset)
  - url: /{basePath}
    description: Sub-path deployment (image built with BASE_PATH, e.g. /security behind the SIWE wallet gateway)
    variables:
      basePath:
        default: security
        description: The value the image was built with, without the leading slash (e.g. security for BASE_PATH=/security).

# Reads are open by default; write operations override with bearerAuth.
security: []

tags:
  - name: System
    description: Liveness
  - name: Overview
    description: Aggregate dashboard metrics
  - name: Repositories
    description: Repositories Hermes watches
  - name: Reviews
    description: Security review reports and history
  - name: Scan
    description: Live active-run state
  - name: Trends
    description: Daily aggregates

paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string }

  /api/overview:
    get:
      tags: [Overview]
      operationId: getOverview
      summary: Aggregate metrics, per-repo summaries, and 14-day trend
      responses:
        '200':
          description: Overview payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }

  /api/repos:
    get:
      tags: [Repositories]
      operationId: listRepos
      summary: List repository summaries
      description: >-
        Sorted by highest open severity, then critical/high issue count, then oldest
        open critical/high first-seen timestamp. Repository ID breaks remaining ties.
      responses:
        '200':
          description: All repositories with status from their head-commit finding union
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RepoSummary' }
    post:
      tags: [Repositories]
      operationId: registerRepo
      summary: Register or update a repository Hermes watches
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoRegister' }
      responses:
        '201':
          description: Repository registered/updated; full detail returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoDetail' }
        '400':
          description: >-
            Invalid JSON body (or not an object), missing `id`/`lang`, a new `id` that
            doesn't match `^[A-Za-z0-9._-]{1,100}$`, or a `lines` that isn't a
            non-negative integer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/repos/{id}:
    get:
      tags: [Repositories]
      operationId: getRepo
      summary: Repository detail with full review history
      parameters:
        - $ref: '#/components/parameters/RepoId'
      responses:
        '200':
          description: Repository found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoDetail' }
        '404':
          description: Repository not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/repos/{id}/rerun:
    get:
      tags: [Repositories]
      operationId: getRerun
      summary: Whether a re-run is pending for this repo
      description: |
        Note: Requests are never cleared and currently not consumed by the agent.
      parameters:
        - $ref: '#/components/parameters/RepoId'
      responses:
        '200':
          description: Current re-run request state
          content:
            application/json:
              schema:
                type: object
                required: [repoId, requestedAt, pending]
                properties:
                  repoId: { type: string }
                  requestedAt:
                    type: [integer, 'null']
                    description: Epoch-ms when last requested, or null
                  pending: { type: boolean }
        '404':
          description: Repository not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Repositories]
      operationId: requestRerun
      summary: Request a re-review on the next Hermes cycle
      description: |
        Open endpoint (no auth) — it records a re-run request for this repository.
        Note: Requests are never cleared and currently not consumed by the agent.
      parameters:
        - $ref: '#/components/parameters/RepoId'
      responses:
        '202':
          description: Re-run request accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, repoId, requestedAt]
                properties:
                  ok: { const: true }
                  repoId: { type: string }
                  requestedAt: { type: integer, description: Epoch-ms }
        '404':
          description: Repository not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/repos/{id}/findings/{fingerprint}/triage:
    put:
      tags: [Repositories]
      operationId: setFindingTriage
      summary: Set or clear a human triage verdict on a finding
      description: |
        User affordance for triage verdicts. Keyed on the finding's stable fingerprint
        so the verdict persists across agent re-runs. `status: open` (or null) clears
        the verdict. Setting a verdict 404s if no finding in the repo currently carries
        the fingerprint; clearing is idempotent.
        Reads identity from `x-hermes-user` header (forwarded by wallet gateway) and
        records it as `triagedBy` (or 'unknown' when omitted).
        Dismissing critical or high findings (false_positive or accepted_risk) requires
        a non-empty note.
      parameters:
        - $ref: '#/components/parameters/RepoId'
        - $ref: '#/components/parameters/Fingerprint'
        - name: x-hermes-user
          in: header
          required: false
          description: Signed-in user identity forwarded by the wallet gateway
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: [string, 'null']
                  enum: [open, acknowledged, false_positive, accepted_risk, null]
                  description: A verdict to set; `open` or `null` clears the verdict.
                note: { type: string, description: Free-text justification }
      responses:
        '200':
          description: Verdict set or cleared
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { const: true }
                  status:
                    type: string
                    enum: [open, acknowledged, false_positive, accepted_risk]
                  note: { type: string }
                  triagedBy:
                    type: string
                    description: Actor who triaged the finding, or 'unknown'
                  cleared:
                    type: boolean
                    description: Present on a clear; whether a row was actually removed
        '400':
          description: Invalid JSON body or status value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Repository, or finding with that fingerprint, not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/repos/{id}/reviews:
    get:
      tags: [Reviews]
      operationId: listRepoReviews
      summary: Reviews for a repository (newest first)
      parameters:
        - $ref: '#/components/parameters/RepoId'
      responses:
        '200':
          description: Review summaries for the repo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewSummary' }
        '404':
          description: Repository not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Reviews]
      operationId: submitReview
      summary: Submit a security review report
      description: |
        Every finding is stored; only exact duplicates (same issue identity at the
        same line + `locationKey`) collapse, to the most severe. Findings sharing an
        identity are one issue with several locations. Identity is `ruleId` + `file`
        + `locationKey` when the finding carries a `ruleId` (the title is ignored, so
        rephrasing keeps it), else the legacy `file` + `title` key; see the
        `fingerprint` field of Finding.

        A commit can be scanned more than once (non-deterministic LLM re-runs,
        different models), so submits are idempotent on scan **content**, not on
        `(repo, commit)`. The content key is commit + model + engine + the issue set,
        where each issue contributes only its identity + most severe rating (a
        finding's line/description/recommendation/code are not part of the key). A
        resubmit with the same key returns the existing review with `duplicate: true`
        and HTTP 200; a different issue set, severity, or model creates a new
        review. The new/carried/resolved diff is a property of the *commit*: only a
        commit's first scan carries a delta (computed against the union of issues on
        the previous commit), and re-scans of the same commit report a zero delta so a
        re-run can't fabricate churn. The repository must be registered first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RepoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSubmitResponse' }
              example: { ok: true, reviewId: 8f3c…, repoId: sapphire-paratime, findings: 3 }
        '200':
          description: A review with identical content already existed (idempotent retry)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSubmitResponse' }
              example: { ok: true, reviewId: 8f3c…, repoId: sapphire-paratime, duplicate: true }
        '400':
          description: >-
            Invalid JSON (or not an object), missing `commit`, an invalid finding, a
            numeric field that isn't a non-negative integer, `findings` that isn't an
            array, or a malformed `nextRunAt` (including 10-digit epoch seconds)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Repository not found — register it first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: Flat review list across repos (newest first)
      parameters:
        - name: repo
          in: query
          required: false
          schema: { type: string }
          description: Scope to a single repository id
        - name: since
          in: query
          required: false
          schema: { type: string }
          description: Inclusive lower bound on creation time; see the `until` parameter for accepted formats
        - name: until
          in: query
          required: false
          schema: { type: string }
          description: >-
            Inclusive upper bound on creation time: epoch-ms (12+ digits), a 4-digit
            year (Jan 1 of that year, UTC, e.g. `2024`), or ISO-8601. A 10-digit value
            is epoch seconds and is rejected with 400.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Matching reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewsResponse' }
        '400':
          description: Malformed time (including 10-digit epoch seconds), or out-of-bounds/non-integer limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/reviews/{id}:
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Single review with findings and diff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Review UUID
      responses:
        '200':
          description: Review found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDetail' }
        '404':
          description: Review not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/scan:
    get:
      tags: [Scan]
      operationId: getScan
      summary: Current active-run state
      responses:
        '200':
          description: Live scan state (singleton)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanState' }
    put:
      tags: [Scan]
      operationId: updateScan
      summary: Update the live scan state
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanUpdate' }
      responses:
        '200':
          description: Updated scan state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanState' }
        '400':
          description: >-
            Invalid JSON (or not an object), `active` missing/not a boolean, a field of
            the wrong type, or an active scan naming an unregistered `repoId`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Scan]
      operationId: updateScanPost
      summary: Alias for PUT /api/scan (identical behaviour)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanUpdate' }
      responses:
        '200':
          description: Updated scan state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanState' }
        '400':
          description: >-
            Invalid JSON (or not an object), `active` missing/not a boolean, a field of
            the wrong type, or an active scan naming an unregistered `repoId`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/trends:
    get:
      tags: [Trends]
      operationId: getTrends
      summary: Daily UTC new/resolved/review aggregates
      description: >-
        Includes the current UTC day and the preceding days in the requested span.
        Buckets run from UTC midnight to the next UTC midnight, independent of the
        server or browser timezone and daylight-saving transitions.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 14 }
        - name: repo
          in: query
          required: false
          schema: { type: string }
          description: Scope to a single repository id
      responses:
        '200':
          description: Continuous, zero-filled UTC daily buckets (oldest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrendsResponse' }
        '400':
          description: Invalid query parameter (e.g. non-integer days)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <HERMES_API_TOKEN>`. Required on write operations
        only when `HERMES_API_TOKEN` is set on the server.

  parameters:
    RepoId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Repository id (e.g. `sapphire-paratime`)
    Fingerprint:
      name: fingerprint
      in: path
      required: true
      schema: { type: string }
      description: >-
        Stable issue identity — the `fingerprint` field of a Finding (16 hex chars)

  responses:
    Unauthorized:
      description: Missing or invalid bearer token (when `HERMES_API_TOKEN` is set)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthorized }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Severity:
      type: string
      enum: [crit, high, med, low]
      description: Finding severity

    SeverityCounts:
      type: object
      required: [crit, high, med, low, total]
      properties:
        crit: { type: integer }
        high: { type: integer }
        med: { type: integer }
        low: { type: integer }
        total: { type: integer, description: Sum of crit + high + med + low }

    RepoRegister:
      type: object
      required: [id, lang]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,100}$'
          description: >-
            Unique repository identifier, one URL path segment (not `.` or `..`).
            Repos registered before this rule can still be updated under their old id.
        lang: { type: string, description: 'Primary language (e.g. Solidity, Rust)' }
        description: { type: string, default: '' }
        path:
          type: string
          description: GitHub path; defaults to `oasisprotocol/{id}`
        branch: { type: string, default: main }
        lines: { type: integer, minimum: 0, default: 0 }

    RepoSummary:
      type: object
      description: >-
        Repository with status derived from its current commit (the most recently
        introduced one), unioned across all of that commit's scans.
      required:
        [id, lang, description, path, branch, lines, counts, quietedCount, status, clean,
         scanning, oldestOpenAt, lastRunAt, lastDurationSecs, filesScanned, headCommit, headScanCount]
      properties:
        id: { type: string }
        lang: { type: string }
        description: { type: string }
        path: { type: string }
        branch: { type: string }
        lines: { type: integer }
        counts:
          allOf:
            - $ref: '#/components/schemas/SeverityCounts'
          description: >-
            Union of findings across every scan of the current commit, excluding those
            quieted by triage (false-positive / accepted-risk).
        quietedCount:
          type: integer
          description: Head-commit findings hidden from `counts` by triage.
        status: { type: string, enum: [flagged, clean] }
        clean: { type: boolean }
        scanning: { type: boolean }
        oldestOpenAt:
          type: [integer, 'null']
          description: >-
            Earliest first-seen epoch-ms among unresolved critical/high issues in the
            head-commit finding union, excluding false-positive and accepted-risk triage.
            Null when no open critical/high issues remain.
        lastRunAt:
          type: [integer, 'null']
          description: Epoch-ms of the current commit's latest scan, or null if never scanned.
        lastDurationSecs:
          type: [integer, 'null']
          description: Duration in seconds of that scan, or null if never scanned.
        filesScanned: { type: integer }
        headCommit:
          type: [string, 'null']
          description: Current commit (most recently introduced), or null if never scanned.
        headScanCount:
          type: integer
          description: How many scans the current commit has; `counts` unions all of them.

    RepoDetail:
      allOf:
        - $ref: '#/components/schemas/RepoSummary'
        - type: object
          required: [reviews]
          properties:
            reviews:
              type: array
              description: Reviews for this repo, newest first
              items: { $ref: '#/components/schemas/ReviewSummary' }

    ReviewSummary:
      type: object
      description: Lightweight review row (no findings).
      required:
        [id, repoId, commit, model, trigger, createdAt, durationSecs, counts, clean, newCount,
         resolvedCount, hasDelta]
      properties:
        id: { type: string, description: Review UUID }
        repoId: { type: string }
        commit: { type: string }
        model: { type: string, description: 'LLM model that produced the review (e.g. claude-opus-4-8); '''' if unreported' }
        prevCommit:
          type: [string, 'null']
          description: Previous commit used for the diff, or null
        trigger: { type: string, description: "e.g. Scheduled, Push to main; '' when unreported" }
        createdAt: { type: integer, description: Epoch-ms }
        durationSecs: { type: integer, description: Scan duration in seconds }
        counts: { $ref: '#/components/schemas/SeverityCounts' }
        clean: { type: boolean }
        newCount: { type: integer }
        resolvedCount: { type: integer }
        hasDelta: { type: boolean }

    ReviewDetail:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required:
            [engine, agentVersion, summary, lines, filesScanned, findings, quietedCount, resolved,
             diff, hasPrev]
          properties:
            engine: { type: string, description: "e.g. slither+semgrep+llm; '' when unreported" }
            agentVersion:
              type: string
              description: Version of the agent that produced the review; '' when unreported.
            summary: { type: string }
            lines: { type: integer }
            filesScanned: { type: integer }
            findings:
              type: array
              items: { $ref: '#/components/schemas/Finding' }
            quietedCount:
              type: integer
              description: Findings excluded from `counts` by triage (still present in `findings`).
            resolved:
              type: array
              items: { $ref: '#/components/schemas/ResolvedFinding' }
            html:
              type: [string, 'null']
              description: Optional sanitized HTML report body
            diff: { $ref: '#/components/schemas/ReviewDiff' }
            hasPrev: { type: boolean }

    ReviewDiff:
      type: object
      required: [newCount, carriedCount, resolvedCount]
      properties:
        newCount: { type: integer }
        carriedCount: { type: integer, description: total - new }
        resolvedCount: { type: integer }

    FindingInput:
      type: object
      required: [severity, title]
      properties:
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        file: { type: string }
        line: { type: integer, minimum: 0 }
        cwe: { type: string, description: e.g. CWE-841 }
        description: { type: string }
        code: { type: string, description: Offending snippet }
        recommendation: { type: string }
        ruleId:
          type: string
          maxLength: 200
          description: >-
            Id of the tool rule or detector that raised the finding (e.g. slither
            `reentrancy-eth`, a semgrep rule id). When present, the finding's identity
            is `ruleId` + `file` + `locationKey` instead of `file` + `title`. Trimmed;
            null or omitted = not sent.
        locationKey:
          type: string
          maxLength: 200
          description: >-
            Enclosing function or symbol of the finding (e.g. `Vault.withdraw`). Part of
            the identity when a `ruleId` is sent; display-only otherwise. Trimmed; null
            or omitted = not sent.

    FindingLocation:
      type: object
      description: One place an issue was reported in a review.
      required: [file, line, locationKey]
      properties:
        file: { type: string }
        line: { type: integer }
        locationKey: { type: string, description: "Enclosing symbol; '' when not sent" }

    Finding:
      type: object
      description: >-
        An issue in a review report: every finding of the review that shares an
        identity (`fingerprint`), with the top-level fields taken from its most severe
        (then earliest-reported) location.
      required:
        [severity, title, file, line, cwe, description, code, recommendation, ruleId,
         locationKey, locations, isNew, openRuns, ageHours, fingerprint, triage]
      properties:
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        file: { type: string }
        line: { type: integer }
        cwe: { type: string }
        description: { type: string }
        code: { type: string }
        recommendation: { type: string }
        ruleId: { type: string, description: "Agent-reported rule id; '' when not sent" }
        locationKey: { type: string, description: "Agent-reported enclosing symbol; '' when not sent" }
        locations:
          type: array
          minItems: 1
          description: >-
            Every location of this issue in the review, ordered by file then line. More
            than one when the same issue was reported at several places.
          items: { $ref: '#/components/schemas/FindingLocation' }
        isNew: { type: boolean }
        openRuns: { type: integer, description: Consecutive scan cycles open }
        ageHours: { type: integer }
        fingerprint:
          type: string
          description: >-
            Stable per-repo issue identity: a hash of `ruleId` + `file` + `locationKey`
            when the agent sent a `ruleId`, else of `file` + `title` (the key every
            finding had before `ruleId` existed). The key of the new/carried/resolved
            diff, the counts, and triage: a verdict is attached to and addressed by it.
        triage:
          oneOf:
            - $ref: '#/components/schemas/Triage'
            - type: 'null'
          description: Human triage verdict, or null when untriaged ("open").

    Triage:
      type: object
      description: >-
        Human triage verdict on a finding, persisted across agent re-runs. acknowledged
        still counts toward a repo's status; false_positive and accepted_risk quiet it.
      required: [status, note, triagedBy, createdAt, updatedAt]
      properties:
        status:
          type: string
          enum: [acknowledged, false_positive, accepted_risk]
        note: { type: string, description: Free-text justification }
        triagedBy:
          type: string
          description: Actor who triaged the finding (from x-hermes-user, or 'unknown')
        createdAt: { type: integer, description: First tagged (epoch-ms) }
        updatedAt: { type: integer, description: Last changed (epoch-ms) }
    ResolvedFinding:
      type: object
      required: [severity, title, file, fingerprint]
      properties:
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        file: { type: string }
        fingerprint: { type: string, description: Issue identity (see Finding) }

    ReviewInput:
      type: object
      required: [commit]
      properties:
        commit: { type: string, description: Commit hash reviewed }
        model:
          type: string
          default: ''
          description: >-
            LLM model that produced the review, e.g. claude-opus-4-8 or gpt-5.
            Distinct from `engine` (the static-analysis tool stack). Part of the
            dedup identity, so two models scanning the same commit are kept as
            separate reviews. Shown per row on the repo's review history.
        trigger:
          type: string
          default: ''
          description: What started the run, e.g. Scheduled. Stored as sent; omitted = '' (shown as —).
        engine:
          type: string
          default: ''
          description: >-
            Static-analysis tool stack, e.g. slither+semgrep+llm. Part of the dedup
            identity. Stored as sent (trimmed); omitted = '' (shown as —).
        summary:
          type: string
          default: ''
          description: >-
            Executive summary. When empty, the report shows a line built from the
            review's own data (issue counts, files, engine, model).
        durationSecs: { type: integer, minimum: 0, default: 0 }
        lines:
          type: integer
          minimum: 0
          description: Defaults to the repo's registered line count if omitted
        filesScanned: { type: integer, minimum: 0, default: 0 }
        agentVersion:
          type: string
          maxLength: 200
          description: >-
            Version of the agent that produced the review (e.g. `hermes-agent 1.4.2`).
            Returned on the review detail and shown on the report only when sent. Not
            part of the dedup identity.
            Trimmed; null or omitted = not sent.
        html:
          type: string
          description: Optional pre-rendered report body; sanitized server-side
        nextRunAt:
          type: [integer, string]
          description: >-
            When the agent plans its next review run — epoch-ms (an integer, or a
            digits-only string of 12+ digits) or ISO-8601. 10-digit epoch seconds are
            rejected with 400. Shown as the dashboard "Next run". The schedule is
            agent-driven/flexible; there is no fixed cadence. Persists until the agent
            reports a new value: omitting it keeps the last reported next run; send 0
            to clear it back to "unscheduled".
        findings:
          type: array
          items: { $ref: '#/components/schemas/FindingInput' }

    ReviewSubmitResponse:
      type: object
      required: [ok, reviewId, repoId]
      properties:
        ok: { const: true }
        reviewId: { type: string }
        repoId: { type: string }
        findings:
          type: integer
          description: Number of findings stored (present on create / 201)
        duplicate:
          type: boolean
          description: Present and true when an identical-content review already existed (200)

    ReviewsResponse:
      type: object
      required: [count, reviews]
      properties:
        count: { type: integer }
        reviews:
          type: array
          items: { $ref: '#/components/schemas/ReviewSummary' }

    ScanState:
      type: object
      description: Singleton live active-run state.
      required: [active, progress, dataVersion]
      properties:
        active: { type: boolean }
        repoId: { type: [string, 'null'] }
        commit: { type: [string, 'null'] }
        currentFile: { type: [string, 'null'] }
        progress: { type: number, description: 0–100 }
        engine: { type: [string, 'null'] }
        startedAt: { type: [integer, 'null'], description: Epoch-ms }
        dataVersion: { type: integer, description: Monotonic counter bumped by DB writes }
    ScanUpdate:
      type: object
      required: [active]
      properties:
        active: { type: boolean, description: 'true during a scan, false when complete' }
        repoId:
          type: [string, 'null']
          description: Must be a registered repository while `active` is true (else 400)
        commit: { type: [string, 'null'] }
        currentFile: { type: [string, 'null'] }
        progress:
          type: integer
          description: 0–100; out-of-range integers are clamped, non-integers are a 400. Defaults to 0.
        engine: { type: [string, 'null'] }
        startedAt: { type: integer, minimum: 0, description: Epoch-ms; defaults to now }

    TrendBucket:
      type: object
      required: [day, date, newFindings, resolvedFindings, reviews]
      properties:
        day: { type: string, description: '`M/D` label for the UTC day, e.g. 6/15' }
        date: { type: integer, description: 'UTC midnight, epoch-ms' }
        newFindings:
          type: integer
          description: Issues first discovered on reviews created during this UTC day.
        resolvedFindings:
          type: integer
          description: Fixes recorded by new-commit reviews during this UTC day.
        reviews:
          type: integer
          description: All reviews created during this UTC day, including same-commit scans.

    TrendsResponse:
      type: object
      required: [days, repo, buckets]
      properties:
        days: { type: integer }
        repo: { type: [string, 'null'], description: 'Repo id if scoped, else null' }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/TrendBucket' }

    Overview:
      type: object
      required:
        [totals, quietedTotal, flagged, clean, reposCount, reviewsAllTime, avgScanSecs,
         lastRunAt, nextRunAt, trend, repos]
      properties:
        totals: { $ref: '#/components/schemas/SeverityCounts' }
        quietedTotal:
          type: integer
          description: Findings quieted by triage across all repos (excluded from `totals`).
        flagged: { type: integer, description: Repos with findings }
        clean: { type: integer, description: Repos without findings }
        reposCount: { type: integer }
        reviewsAllTime: { type: integer }
        avgScanSecs:
          type: [integer, 'null']
          description: Mean scan duration across all reviews in whole seconds, or null if there are none.
        lastRunAt:
          type: [integer, 'null']
          description: Epoch-ms of the most recent review of any repo, or null if there are none.
        nextRunAt:
          type: [integer, 'null']
          description: Epoch-ms of the agent's next planned run, or null if unscheduled.
        trend:
          type: array
          description: Same 14 UTC daily buckets as GET /api/trends?days=14.
          items: { $ref: '#/components/schemas/TrendBucket' }
        repos:
          type: array
          items: { $ref: '#/components/schemas/RepoSummary' }
